name: Quant Bot Reporter

on:
  workflow_dispatch: 
  schedule:
    # --- [매일] 단타 결산 (월~금) ---
    - cron: '40 6 * * 1-5'  # 한국 마감 (15:40 KST)
    - cron: '10 20 * * 1-5' # 미국 마감 (05:10 KST)
    
    # --- [매주 금요일] DCA 주간 리포트 ---
    - cron: '50 6 * * 5'  # 한국 금요일 마감 후 (15:50 KST)
    - cron: '20 20 * * 5' # 미국 금요일 마감 후 (05:20 KST)

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Execute Reporter
      env:
        GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        WEBHOOK_KR_DANTA: ${{ secrets.WEBHOOK_KR_DANTA }}
        WEBHOOK_US_DANTA: ${{ secrets.WEBHOOK_US_DANTA }}
        WEBHOOK_KR_DCA: ${{ secrets.WEBHOOK_KR_DCA }}
        WEBHOOK_US_DCA: ${{ secrets.WEBHOOK_US_DCA }}
        # 💡 핵심: 깃허브가 울린 알람 시간 자체를 변수로 가져옵니다!
        CRON_SCHEDULE: ${{ github.event.schedule }}
        
      run: |
        echo "⏰ 울린 알람(Cron): $CRON_SCHEDULE"

        # 1. 한국장 단타 & 불장 결산 알람 ("40 6" 포함 여부)
        if [[ "$CRON_SCHEDULE" == *"40 6"* ]]; then
          echo "📝 [한국장] 당일 성적표 발송"
          python report.py --market kr --mode danta
          python report.py --market kr --mode bull
          
        # 2. 미국장 단타 & 불장 결산 알람 ("10 20" 포함 여부)
        elif [[ "$CRON_SCHEDULE" == *"10 20"* ]]; then
          echo "📝 [미국장] 당일 성적표 발송"
          python report.py --market us --mode danta
          python report.py --market us --mode bull
          
        # 3. 한국장 주간 DCA 리포트 알람 ("50 6" 포함 여부)
        elif [[ "$CRON_SCHEDULE" == *"50 6"* ]]; then
          echo "💼 [한국장] 주간 DCA 성적표 발송"
          python report.py --market kr --mode dca
          
        # 4. 미국장 주간 DCA 리포트 알람 ("20 20" 포함 여부)
        elif [[ "$CRON_SCHEDULE" == *"20 20"* ]]; then
          echo "💼 [미국장] 주간 DCA 성적표 발송"
          python report.py --market us --mode dca
          
        # 5. 수동 실행 (Run workflow 버튼 클릭 시)
        else
          echo "🛠️ 수동 테스트: 단타, 불장, DCA 풀가동!"
          python report.py --market kr --mode danta
          python report.py --market kr --mode bull
          python report.py --market kr --mode dca
          python report.py --market us --mode danta
          python report.py --market us --mode bull
          python report.py --market us --mode dca
        fi
