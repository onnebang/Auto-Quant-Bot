name: Quant Bot Reporter

on:
  workflow_dispatch: 
  schedule:
    # --- [매일] 단타 결산 (월~금) ---
    - cron: '40 6 * * 1-5'  # 한국 마감 (15:40 KST)
    - cron: '10 20 * * 1-5' # 미국 마감 (05:10 KST)
    
    # --- [매주 금요일] DCA 주간 리포트 ---
    - cron: '50 6 * * 5'  # 한국 금요일 마감 후 (15:50 KST)
    - cron: '20 20 * * 5' # 미국 금요일 마감 후 (05:20 KST)

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Execute Reporter
      env:
        GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        WEBHOOK_KR_DANTA: ${{ secrets.WEBHOOK_KR_DANTA }}
        WEBHOOK_US_DANTA: ${{ secrets.WEBHOOK_US_DANTA }}
        WEBHOOK_KR_DCA: ${{ secrets.WEBHOOK_KR_DCA }}   # 추가!
        WEBHOOK_US_DCA: ${{ secrets.WEBHOOK_US_DCA }}   # 추가!
        
      run: |
        HOUR=$(date -u +"%H")
        MINUTE=$(date -u +"%M")
        DAY_OF_WEEK=$(date -u +"%u") # 5 = 금요일

        echo "서버 시간: $HOUR:$MINUTE / 요일: $DAY_OF_WEEK"

        # 1. 단타 결산 (매일)
        if [ "$HOUR" == "06" ] && [ "$MINUTE" == "40" ]; then
          python report.py --market kr --mode danta
        elif [ "$HOUR" == "20" ] && [ "$MINUTE" == "10" ]; then
          python report.py --market us --mode danta
        fi

        # 2. DCA 주간 리포트 (금요일에만)
        if [ "$DAY_OF_WEEK" == "5" ]; then
          if [ "$HOUR" == "06" ] && [ "$MINUTE" == "50" ]; then
            python report.py --market kr --mode dca
          elif [ "$HOUR" == "20" ] && [ "$MINUTE" == "20" ]; then
            python report.py --market us --mode dca
          fi
        fi
        
        # 3. 수동 실행(workflow_dispatch) 테스트용 풀가동!
        if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
          echo "수동 테스트: 4개 리포트 동시 발사!"
          python report.py --market kr --mode danta
          python report.py --market us --mode danta
          python report.py --market kr --mode dca
          python report.py --market us --mode dca
        fi
