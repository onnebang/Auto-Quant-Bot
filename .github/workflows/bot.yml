name: Quant Bot Auto Run

on:
  workflow_dispatch:
  schedule:
    # --- [DCA 장기투자 (하루 1번)] ---
    # 한국장 마감 전 (KST 15:15) -> UTC 06:15
    - cron: '15 6 * * 1-5' 
    # 미국장 마감 전 (KST 04:45) -> UTC 19:45
    - cron: '45 19 * * 1-5'

    # --- [단타 & 불장 (장중 30분 간격으로 초정밀 스캔!)] ---
    # 한국장 (KST 10:00~15:30) -> UTC 01:00~06:30
    - cron: '0,20,40 0-6 * * 1-5'
    # 미국장 (KST 23:00~04:30) -> UTC 14:00~19:30
    - cron: '0,20,40 13-19 * * 1-5'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Execute Strategy
      env:
        WEBHOOK_KR_DCA: ${{ secrets.WEBHOOK_KR_DCA }}
        WEBHOOK_KR_DANTA: ${{ secrets.WEBHOOK_KR_DANTA }}
        WEBHOOK_US_DCA: ${{ secrets.WEBHOOK_US_DCA }}
        WEBHOOK_US_DANTA: ${{ secrets.WEBHOOK_US_DANTA }}
        WEBHOOK_JP_DCA: ${{ secrets.WEBHOOK_JP_DCA }}
        WEBHOOK_JP_DANTA: ${{ secrets.WEBHOOK_JP_DANTA }}
        GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      run: |
        HOUR=$(date -u +"%H")
        MINUTE=$(date -u +"%M")
        
        echo "현재 서버 시간: $HOUR:$MINUTE (UTC)"

        # 1. 한국장 DCA 
        if [ "$HOUR" == "06" ] && [ "$MINUTE" == "15" ]; then
          python main.py --market kr --mode dca
          
        # 2. 미국장 DCA 
        elif [ "$HOUR" == "19" ] && [ "$MINUTE" == "45" ]; then
          python main.py --market us --mode dca
          
        # 3. 한국장 장중 (단타 스캔 후 불장 스캔 연속 실행)
        elif [[ "$HOUR" -ge "01" && "$HOUR" -le "06" ]]; then
          echo "🇰🇷 한국장 단타 & 불장 스캔 시작"
          python main.py --market kr --mode danta
          python main.py --market kr --mode bull
          
        # 4. 미국장 장중 (단타 스캔 후 불장 스캔 연속 실행)
        elif [[ "$HOUR" -ge "14" && "$HOUR" -le "19" ]]; then
          echo "🇺🇸 미국장 단타 & 불장 스캔 시작"
          python main.py --market us --mode danta
          python main.py --market us --mode bull
          
        # 5. 수동 실행 (Run workflow 버튼 클릭 시)
        else
          echo "테스트: 한국장/미국장 단타 & 불장 수동 스캔!"
          python main.py --market kr --mode danta
          python main.py --market kr --mode bull
          python main.py --market us --mode danta
          python main.py --market us --mode bull
        fi
