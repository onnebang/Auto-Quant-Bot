name: Quant Bot Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1-5' 
    - cron: '45 19 * * 1-5'
    - cron: '0 1-6 * * 1-5'
    - cron: '0 14-19 * * 1-5'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4 # 버전 업그레이드
    
    - name: Set up Python
      uses: actions/setup-python@v5 # 버전 업그레이드
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Execute Strategy
      env:
        WEBHOOK_KR_DCA: ${{ secrets.WEBHOOK_KR_DCA }}
        WEBHOOK_KR_DANTA: ${{ secrets.WEBHOOK_KR_DANTA }}
        WEBHOOK_US_DCA: ${{ secrets.WEBHOOK_US_DCA }}
        WEBHOOK_US_DANTA: ${{ secrets.WEBHOOK_US_DANTA }}
        WEBHOOK_JP_DCA: ${{ secrets.WEBHOOK_JP_DCA }}
        WEBHOOK_JP_DANTA: ${{ secrets.WEBHOOK_JP_DANTA }}
      run: |
        HOUR=$(date -u +"%H")
        MINUTE=$(date -u +"%M")
        
        # 1. 아시아 DCA (06:15)
        if [ "$HOUR" == "06" ] && [ "$MINUTE" == "15" ]; then
          python main.py --market kr --mode dca
          python main.py --market jp --mode dca
        # 2. 미국 DCA (19:45)
        elif [ "$HOUR" == "19" ] && [ "$MINUTE" == "45" ]; then
          python main.py --market us --mode dca
        # 3. 아시아 단타 (01:00~06:00)
        elif [ "$HOUR" -ge 01 ] && [ "$HOUR" -le 06 ]; then
          python main.py --market kr --mode danta
          python main.py --market jp --mode danta
        # 4. 미국 단타 (14:00~19:00)
        elif [ "$HOUR" -ge 14 ] && [ "$HOUR" -le 19 ]; then
          python main.py --market us --mode danta
        # 5. 그 외 시간 수동 실행 시 기본 동작
        else
          python main.py --market kr --mode danta
        fi
