name: Quant Bot Auto Run

on:
  workflow_dispatch:
  schedule:
    # --- [DCA 장기투자 (하루 1번)] ---
    # 한국장 마감 전 (KST 15:15) -> UTC 06:15
    - cron: '15 6 * * 1-5' 
    # 미국장 마감 전 (KST 04:45) -> UTC 19:45
    - cron: '45 19 * * 1-5'

    # --- [단타 & 불장 (장중 20분 간격으로 초정밀 스캔!)] ---
    # 한국장 (KST 10:00~15:40) -> UTC 01:00~06:40
    - cron: '0,20,40 0-6 * * 1-5'
    # 미국장 (KST 23:00~04:40) -> UTC 14:00~19:40
    - cron: '0,20,40 13-19 * * 1-5'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Execute Strategy
      env:
        WEBHOOK_KR_DCA: ${{ secrets.WEBHOOK_KR_DCA }}
        WEBHOOK_KR_DANTA: ${{ secrets.WEBHOOK_KR_DANTA }}
        WEBHOOK_US_DCA: ${{ secrets.WEBHOOK_US_DCA }}
        WEBHOOK_US_DANTA: ${{ secrets.WEBHOOK_US_DANTA }}
        WEBHOOK_JP_DCA: ${{ secrets.WEBHOOK_JP_DCA }}
        WEBHOOK_JP_DANTA: ${{ secrets.WEBHOOK_JP_DANTA }}
        GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        # 💡 핵심: 깃허브가 울린 알람 시간을 직접 변수로 가져옵니다!
        CRON_SCHEDULE: ${{ github.event.schedule }}
      run: |
        echo "⏰ 울린 알람(Cron): $CRON_SCHEDULE"

        # 1. 한국장 DCA 알람이 울렸을 때
        if [ "$CRON_SCHEDULE" == "15 6 * * 1-5" ]; then
          echo "💼 [한국장] DCA 스캔 시작"
          python main.py --market kr --mode dca
          
        # 2. 미국장 DCA 알람이 울렸을 때
        elif [ "$CRON_SCHEDULE" == "45 19 * * 1-5" ]; then
          echo "💼 [미국장] DCA 스캔 시작"
          python main.py --market us --mode dca
          
        # 3. 한국장 장중 20분 간격 알람이 울렸을 때
        elif [ "$CRON_SCHEDULE" == "0,20,40 1-6 * * 1-5" ]; then
          echo "🇰🇷 [한국장] 단타 & 불장 스캔 시작"
          python main.py --market kr --mode danta
          python main.py --market kr --mode bull
          
        # 4. 미국장 장중 20분 간격 알람이 울렸을 때
        elif [ "$CRON_SCHEDULE" == "0,20,40 14-19 * * 1-5" ]; then
          echo "🇺🇸 [미국장] 단타 & 불장 스캔 시작"
          python main.py --market us --mode danta
          python main.py --market us --mode bull
          
        # 5. 수동 실행 (Run workflow 버튼 클릭 시 알람 값이 없음)
        else
          echo "🛠️ 테스트: 한국장/미국장 단타 & 불장 수동 스캔!"
          python main.py --market kr --mode danta
          python main.py --market kr --mode bull
          python main.py --market us --mode danta
          python main.py --market us --mode bull
        fi
